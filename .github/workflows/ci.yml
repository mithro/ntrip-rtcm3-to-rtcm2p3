name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install independent cross-check tools (gpsdecode, RTKLIB str2str)
        run: sudo apt-get update && sudo apt-get install -y gpsd-clients rtklib
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Test
        run: uv run --extra dev pytest
