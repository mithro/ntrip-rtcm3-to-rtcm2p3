name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history + tags so hatch-vcs can derive the version
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install independent cross-check tools (gpsdecode, RTKLIB str2str)
        run: sudo apt-get update && sudo apt-get install -y gpsd-clients rtklib
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Test
        run: uv run --extra dev pytest
      - name: Build docs (warnings are errors)
        run: uv run --extra docs sphinx-build -W -b html docs docs/_build/html
