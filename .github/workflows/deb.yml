name: Debian Packages

on:
  push:
    branches: [main]

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git \
            dpkg-dev debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-hatchling python3-stdeb python3-pip

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Derive version from git describe
        run: |
          DESC=$(git describe --tags --always --match 'v*' --dirty)
          # v0.1.0 -> 0.1.0 ; v0.1.0-5-gabcdef -> 0.1.0+5.gabcdef (deb-valid, sorts above 0.1.0)
          VER=$(echo "$DESC" | sed -E 's/^v//; s/-([0-9]+)-g/+\1.g/; s/-dirty/.dirty/')
          echo "git describe: $DESC -> deb/scm version: $VER"
          echo "PKG_VERSION=$VER" >> "$GITHUB_ENV"
          # hatch-vcs runs inside pybuild's out-of-tree copy (no .git); pin the version.
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Write debian/changelog from the derived version
        run: |
          {
            echo "ntrip-rtcm3-to-rtcm2p3 ($PKG_VERSION) unstable; urgency=medium"
            echo ""
            echo "  * Automated build from $(git describe --tags --always --match 'v*' --dirty)."
            echo ""
            echo " -- Tim 'mithro' Ansell <me@mith.ro>  $(date -R)"
          } > debian/changelog
          head -1 debian/changelog

      - name: Run the test suite (gate publishing on tests passing)
        run: |
          apt-get install -y --no-install-recommends gpsd-clients rtklib python3-pip
          pip install --break-system-packages '.[dev]'
          python3 -m pytest

      - name: Build this package
        run: dpkg-buildpackage -us -uc -b

      - name: Build unpackaged deps (pyrtcm, pynmeagps) from PyPI
        run: |
          mkdir -p /tmp/deps /tmp/depdebs
          pip download --no-deps --no-binary=:all: --dest /tmp/deps \
            "pynmeagps>=1.1.4" "pyrtcm>=1.2"
          # pynmeagps first; pyrtcm depends on it (dh_python3 can't infer this
          # from the sdist without the package in the archive)
          packaging/build-pypi-deb.sh /tmp/deps/pynmeagps-*.tar.gz /tmp/depdebs
          packaging/build-pypi-deb.sh /tmp/deps/pyrtcm-*.tar.gz /tmp/depdebs python3-pynmeagps

      - name: Collect debs
        run: |
          mkdir -p built-debs
          cp ../*.deb built-debs/
          cp /tmp/depdebs/*.deb built-debs/ || true
          ls -l built-debs/

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: built-debs/

  publish-apt:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: apt-repo/

      - name: Generate apt repo metadata
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils
          cd apt-repo
          dpkg-scanpackages --multiversion . > Packages
          gzip -k Packages
          cat > Release <<EOF
          Origin: ntrip-rtcm3-to-rtcm2p3
          Label: ntrip-rtcm3-to-rtcm2p3
          Suite: stable
          Codename: trixie
          Architectures: all
          Components: main
          Description: ntrip-rtcm3-to-rtcm2p3 apt repository
          EOF
          sed -i 's/^          //' Release
          apt-ftparchive release . >> Release

      - name: Sign repo (only if a signing key secret is configured)
        id: sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "APT_GPG_PRIVATE_KEY not set -> publishing an UNSIGNED repo" \
                 "(install with [trusted=yes]). Add the secret to enable signing." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd apt-repo
          gpg --batch --yes --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --armor --clearsign --output InRelease Release
          gpg --batch --yes --armor --export > ntrip-rtcm3-to-rtcm2p3.gpg
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Create index page
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          base=https://mith.ro/ntrip-rtcm3-to-rtcm2p3
          if [ "$SIGNED" = "true" ]; then
            setup=$(cat <<EOF
          # Verified install (repo is GPG-signed):
          curl -fsSL $base/ntrip-rtcm3-to-rtcm2p3.gpg \\
            | sudo tee /etc/apt/keyrings/ntrip-rtcm3-to-rtcm2p3.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/ntrip-rtcm3-to-rtcm2p3.gpg] $base/ ./" \\
            | sudo tee /etc/apt/sources.list.d/ntrip-rtcm3-to-rtcm2p3.list
          sudo apt update && sudo apt install ntrip-rtcm3-to-rtcm2p3
          EOF
          )
          else
            setup=$(cat <<EOF
          # This repository is currently UNSIGNED; trust it explicitly:
          echo "deb [trusted=yes] $base/ ./" \\
            | sudo tee /etc/apt/sources.list.d/ntrip-rtcm3-to-rtcm2p3.list
          sudo apt update && sudo apt install ntrip-rtcm3-to-rtcm2p3
          EOF
          )
          fi
          {
            echo '<!DOCTYPE html><html>'
            echo '<head><title>ntrip-rtcm3-to-rtcm2p3 apt repository</title></head>'
            echo '<body><h1>ntrip-rtcm3-to-rtcm2p3</h1>'
            echo '<p>📖 Documentation: <a href="https://ntrip-rtcm3-to-rtcm2p3.readthedocs.io/">ntrip-rtcm3-to-rtcm2p3.readthedocs.io</a></p>'
            echo '<h2>apt repository</h2><pre>'
            printf '%s\n' "$setup"
            echo '</pre></body></html>'
          } > apt-repo/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo/
      - id: deploy
        uses: actions/deploy-pages@v4
