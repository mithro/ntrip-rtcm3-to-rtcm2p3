name: Debian packages

# Rolling release: every push to main tests, builds the packages for each
# suite, and republishes a signed apt repository per suite on GitHub Pages
# (https://mith.ro/ntrip-rtcm3-to-rtcm2p3/<suite>/). A pull request runs the
# same tests and builds, and publishes nothing.
#
# This follows mithro/apt-repo-action's docs/packaging.md; how this
# repository is packaged is declared in .github/apt-packaging.toml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default: only the publish job below raises this, and only
# for itself. The build jobs run Docker and fetch third-party sources, so they
# should never hold a token that can write to Pages.
permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  # A newer push to a pull request cancels the older build. On the default
  # branch a running publish is never cancelled: the newest push waits for it,
  # and replaces any older push still waiting (it contains that one's commits).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The project's own tests, formerly the "CI" workflow (ci.yml), run with
  # each suite's own Python, as the packages will be.
  test:
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky, sid]
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.suite }}
    env:
      # The suite's python3, never a uv-managed download.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      # Before the checkout: without git in the container, actions/checkout
      # downloads a tarball instead of cloning, and hatch-vcs has no history
      # to derive the version from.
      - name: Install test dependencies
        run: |
          apt-get update
          # gpsd-clients and rtklib: gpsdecode and str2str, the independent
          # implementations the tests cross-check against.
          apt-get install -y --no-install-recommends \
            ca-certificates git gpsd-clients python3 rtklib
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0       # full history + tags so hatch-vcs can derive the version
      # The workspace belongs to the runner's user, not the container's root,
      # and git won't read a tree owned by someone else.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The build generates debian/changelog: apt-repo-action's shared
      # scripts/deb-version.py writes the build's entry, with the version
      # derived from git. Committing a build's output would pin a stale
      # version (and name a commit that may not exist), so it must not be
      # tracked.
      - name: debian/changelog is not committed
        run: |
          git rev-parse --is-inside-work-tree
          if git ls-files --error-unmatch debian/changelog; then
            echo "::error file=debian/changelog::debian/changelog is committed, but the build generates it: git rm it"
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Test
        run: uv run --extra dev pytest
      - name: Build docs (warnings are errors)
        run: uv run --extra docs sphinx-build -W -b html docs docs/_build/html

  build-deb:
    name: build-deb (${{ matrix.suite }} ${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky, sid]
        # Architecture: all (pure Python): one build per suite serves every
        # architecture.
        arch: [all]
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history + tags: the version is git describe's

      # The shared build: debian:<suite>, build deps from debian/control, and
      # the version from the shared deb-version.py (with ~deb<R>, and ~pr<P>
      # on a pull request). Writes the .debs to built-debs/.
      - name: Build
        uses: mithro/apt-repo-action/build-deb@main
        with:
          suite: ${{ matrix.suite }}
          arch: ${{ matrix.arch }}

      # python3-pyrtcm and python3-pynmeagps, the runtime dependencies not
      # every suite's Debian archive has (pyrtcm is in none, pynmeagps is in
      # forky and sid but not trixie), built from their PyPI sdists and
      # published alongside, into the same built-debs/.
      # packaging/build-pypi-deb.sh has all of it: what is needed, the build
      # dependencies, and the version, <upstream>-0+welland<M>[~deb<R>]. It
      # asks the suite's own apt, and builds nothing where Debian has the
      # package: ours must never shadow Debian's.
      - name: Build pyrtcm and pynmeagps
        env:
          SUITE: ${{ matrix.suite }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # <M> and the changelog date: the commits that changed the script,
          # and the last one's time, so the same packaging gives the same
          # version.
          OURS=$(git rev-list --count HEAD -- packaging/build-pypi-deb.sh)
          DATE=$(git log -1 --format=%cd --date=rfc2822 -- packaging/build-pypi-deb.sh)
          export OURS DATE
          docker run --rm -e SUITE -e PR -e OURS -e DATE \
            -v "$PWD/packaging:/packaging:ro" -v "$PWD/built-debs:/out" \
            "debian:$SUITE" bash /packaging/build-pypi-deb.sh /out

      # Install what was just built into a clean container of the same suite,
      # and convert a canned RTCM3 frame with it (packaging/install-test.sh).
      - name: Install test
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          docker run --rm \
            -v "$PWD/built-debs:/debs:ro" -v "$PWD/packaging:/packaging:ro" \
            "debian:$SUITE" sh /packaging/install-test.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: built-debs/*.deb
          retention-days: 14

  publish-apt:
    # Scoped to this job alone. A job calling a reusable workflow sets the
    # maximum permissions available to it, so the elevated Pages scopes stay
    # here rather than applying to the whole workflow.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Build and test pull requests, but never publish from one (or from any
    # branch but main): that would overwrite the live repository with
    # unreviewed packages.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build-deb
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "trixie forky sid"
      # Architecture: all -- one deb serves every architecture.
      architectures: "all"
      description: "NTRIP caster converting RTCM3 to RTCM2.3"
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
