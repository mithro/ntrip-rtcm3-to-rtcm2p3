name: Publish to PyPI

# Publishes to PyPI on every push to main and on version tags. The hatch-vcs
# post-release scheme produces a proper, uploadable version each time: a clean
# release (0.1.0) on a tag, and 0.1.0.postN on the Nth commit after it — no .dev
# and no local "+segment", so every commit is a real, PyPI-uploadable release.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history + tags so hatch-vcs derives the version
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build sdist + wheel (post-release version via hatch-vcs)
        run: uv build
      - name: Sanity-check the version is PyPI-uploadable (no local +segment)
        run: |
          ls dist/
          if ls dist/*+*.whl dist/*+*.tar.gz 2>/dev/null | grep -q .; then
            echo "::error::built version has a local '+' segment; not PyPI-uploadable" >&2
            exit 1
          fi
      - name: Validate metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # matches the PyPI Trusted Publisher configuration
    permissions:
      id-token: write          # OIDC token for PyPI trusted publishing (no API token)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A workflow re-run on the same commit rebuilds the same version; don't
          # fail because that version is already on PyPI.
          skip-existing: true
