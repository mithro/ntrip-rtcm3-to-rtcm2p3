[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ntrip-rtcm3-to-rtcm2p3"
dynamic = ["version"]
description = "NTRIP receiver + LAN rebroadcaster that converts an RTCM 3.x reference stream into RTCM 2.3 DGPS corrections for legacy receivers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tim 'mithro' Ansell", email = "me@mith.ro" }]
keywords = ["ntrip", "rtcm", "gnss", "dgps", "gps"]
dependencies = ["pyrtcm>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
docs = ["sphinx>=7", "myst-parser>=3", "furo>=2024.1"]

[project.scripts]
ntrip-rtcm3-to-rtcm2p3 = "rtcm3to2p3.cli:main"

[project.urls]
Homepage = "https://github.com/mithro/ntrip-rtcm3-to-rtcm2p3"
Documentation = "https://ntrip-rtcm3-to-rtcm2p3.readthedocs.io/"
Repository = "https://github.com/mithro/ntrip-rtcm3-to-rtcm2p3"
Issues = "https://github.com/mithro/ntrip-rtcm3-to-rtcm2p3/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# Written at build time so the git-describe version is embedded in the package
# (importable even when installed from a tarball with no .git present).
version-file = "rtcm3to2p3/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["rtcm3to2p3"]

[tool.hatch.build.targets.sdist]
# Include the VCS metadata resolution so `pip install` from a git checkout or an
# sdist carries the derived version.
include = ["rtcm3to2p3", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
