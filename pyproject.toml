[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ntrip-rtcm3-to-rtcm2p3"
version = "0.1.0"
description = "NTRIP receiver + LAN rebroadcaster that converts an RTCM 3.x reference stream into RTCM 2.3 DGPS corrections for legacy receivers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tim 'mithro' Ansell", email = "me@mith.ro" }]
keywords = ["ntrip", "rtcm", "gnss", "dgps", "gps"]
dependencies = ["pyrtcm>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
docs = ["sphinx>=7", "myst-parser>=3", "furo>=2024.1"]

[project.scripts]
ntrip-rtcm3-to-rtcm2p3 = "rtcm3to2p3.cli:main"

[project.urls]
Homepage = "https://github.com/mithro/ntrip-rtcm3-to-rtcm2p3"
Documentation = "https://mithro.github.io/ntrip-rtcm3-to-rtcm2p3/docs/"

[tool.hatch.build.targets.wheel]
packages = ["rtcm3to2p3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
